<title>SBĐ · Website Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700&display=swap">
<style>
:root{--navy:#12285F;--navy2:#1B3A8C;--cyan:#00C2E0;--ink:#EAF0FF;--sub:#AEBCE8;--bar:#0B1840;--line:#24315C}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"Be Vietnam Pro",system-ui,sans-serif;background:var(--bar)}
.shell{display:flex;flex-direction:column;height:100vh}
.bar{background:linear-gradient(100deg,var(--navy),var(--bar));border-bottom:1px solid var(--line);padding:9px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;flex:none}
.logo{background:#fff;border-radius:7px;padding:4px 9px;display:inline-flex;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.logo img{height:24px;display:block}
.pills{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.grp{color:var(--cyan);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-left:8px}
.pill{border:1px solid var(--line);background:transparent;color:var(--sub);font-family:inherit;font-weight:600;font-size:12.5px;padding:6px 12px;border-radius:999px;cursor:pointer;transition:.15s;white-space:nowrap}
.pill:hover{color:#fff;border-color:var(--cyan)}
.pill.active{background:var(--cyan);color:#052030;border-color:var(--cyan)}
.spacer{margin-left:auto}
.hint{color:var(--sub);font-size:11.5px}
.hint b{color:var(--cyan)}
iframe{flex:1;width:100%;border:none;background:#fff}
@media(max-width:760px){.hint{display:none}}
</style>

function dec(s){return decodeURIComponent(Array.prototype.map.call(atob(s),function(c){return '%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)}).join(''))}
function go(k){
  if(!PAGES[k])k='home';
  var html='<style>header.nav{display:none!important}</style>'+dec(PAGES[k]);
  document.getElementById('fr').srcdoc=html;
  document.querySelectorAll('.pill').forEach(function(b){b.classList.toggle('active',b.dataset.k===k)});
  if(location.hash.slice(1)!==k)history.replaceState(null,'','#'+k);
}
window.addEventListener('hashchange',function(){go(location.hash.slice(1)||'home')});
go(location.hash.slice(1)||'home');
